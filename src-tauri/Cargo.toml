[package]
name = "yk-encrypter"
version = "1.0.1"
description = "Шифрование строк с помощью YubiKey (PIV slot 9d, P-256)"
edition = "2021"
license = "MIT"
repository = "https://github.com/evlbon/yk-encrypter"
default-run = "yk-encrypter"

[lib]
name = "yk_encrypter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yk-encrypter"
path = "src/main.rs"

[[bin]]
name = "ykenc"
path = "src/bin/ykenc.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PC/SC: winscard на Windows, PCSC.framework на macOS, pcsclite на Linux
pcsc = "2"
# Криптография
p256 = { version = "0.14", features = ["ecdh", "pem", "getrandom"] }
hkdf = "0.13"
sha2 = "0.11"
aes-gcm = "0.11"
getrandom = "0.4"
base64 = "0.22"
zeroize = "1"
thiserror = "2"
# скрытый ввод PIN в CLI (macOS/Windows/Linux)
rpassword = "7"

[profile.release]
strip = true
lto = true
codegen-units = 1
