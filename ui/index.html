<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>YubiKey Encrypter</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="status">
      <span class="dot" id="dot"></span>
      <span id="presence"></span>
      <span class="spacer"></span>
      <span class="key" id="keyinfo"></span>
      <button class="icon" id="refresh">↻</button>
      <button class="icon lang" id="lang"></button>
    </header>

    <div class="segmented" role="tablist">
      <button class="seg active" data-mode="encrypt" role="tab"></button>
      <button class="seg" data-mode="decrypt" role="tab"></button>
    </div>

    <section class="field">
      <div class="row">
        <label for="input" id="inputLabel"></label>
        <span class="spacer"></span>
        <button class="link" id="paste"></button>
        <button class="link" id="clear"></button>
      </div>
      <textarea id="input" spellcheck="false"></textarea>
    </section>

    <section class="field pin hidden" id="pinRow">
      <label for="pin" id="pinLabel"></label>
      <input id="pin" type="password" autocomplete="off" maxlength="8" />
    </section>

    <section class="actions">
      <button class="primary" id="run"></button>
      <span class="message" id="message"></span>
    </section>

    <section class="field">
      <div class="row">
        <label for="output" id="outputLabel"></label>
        <span class="spacer"></span>
        <button class="link" id="copy" disabled></button>
      </div>
      <textarea id="output" readonly spellcheck="false"></textarea>
    </section>
  </main>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
