name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tauri:
    name: tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - run: npm ci

      - name: Unit tests (crypto, format)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build bundles
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yk-encrypter-${{ matrix.os }}
          if-no-files-found: error
          path: |
            tauri/src-tauri/target/release/bundle/msi/*.msi
            tauri/src-tauri/target/release/bundle/nsis/*.exe
            tauri/src-tauri/target/release/bundle/dmg/*.dmg
            tauri/src-tauri/target/release/bundle/macos/*.app.tar.gz

  swift-macos:
    name: swift (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: yk-encrypter-swift-macos
          path: |
            dist/YkEncrypter.zip
            dist/YkEncrypter.dmg
