[package]
name = "yk-encrypter"
version = "1.0.0"
description = "Шифрование строк с помощью YubiKey (PIV slot 9d, P-256)"
edition = "2021"
default-run = "yk-encrypter"

[lib]
name = "yk_encrypter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yk-encrypter"
path = "src/main.rs"

[[bin]]
name = "ykenc"
path = "src/bin/ykenc.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YubiKey PIV поверх PC/SC (winscard на Windows, PCSC.framework на macOS, pcsclite на Linux)
yubikey = "0.8"
# Криптография (версии согласованы с зависимостями yubikey)
p256 = { version = "0.13", features = ["ecdh", "pem"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
zeroize = "1"
thiserror = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
